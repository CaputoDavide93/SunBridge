<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 444" width="1180" height="444" role="img" aria-label="The inverter's data reaches the ShineLan-X datalogger, which uploads records over TCP port 5279 to sunbridge inside Home Assistant; sunbridge acknowledges its announce and data records, echoes its pings, sets the datalogger's clock, and turns live records into sensors for the Energy dashboard."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#6b7684"/></marker></defs><rect x="24" y="56" width="180" height="112" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,69.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></g><text x="71.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Inverter</text><text x="40.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Growatt MIC 2500TL-X,</text><text x="40.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">grid-tie, one string</text><rect x="318" y="56" width="180" height="112" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(334.0,69.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a15 15 0 0 1 20 0 M5.5 12.5a10 10 0 0 1 13 0 M9 16a5 5 0 0 1 6 0 M12 19.5h.01"/></g><text x="365.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Datalogger</text><text x="334.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">ShineLan-X, Ethernet,</text><text x="334.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">uploads every 5 min</text><rect x="668" y="56" width="180" height="112" rx="10" fill="#FFC94D" stroke="#FFC94D" stroke-width="1"/><g transform="translate(684.0,69.0) scale(0.8750)" fill="none" stroke="#14233F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v6H4z M4 14h16v6H4z M7 7h.01 M7 17h.01 M11 7h6 M11 17h6"/></g><text x="715.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#14233F" text-anchor="start" font-weight="600">sunbridge</text><text x="684.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#14233F" text-anchor="start" opacity="0.85">TCP server inside</text><text x="684.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#14233F" text-anchor="start" opacity="0.85">Home Assistant</text><rect x="976" y="56" width="180" height="112" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(992.0,69.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4 M4 20h16 M8 16v-5 M12 16V8 M16 16v-3"/></g><text x="1023.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Sensors</text><text x="992.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">power, energy, PV,</text><text x="992.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">temperature, status</text><rect x="668" y="252" width="180" height="112" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(684.0,265.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 5 12 2.5-6h4"/></g><text x="715.0" y="280.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Diagnostics</text><text x="684.0" y="304.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">counts per record type,</text><text x="684.0" y="322.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">CRC failures, no serials</text><rect x="976" y="252" width="180" height="112" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(992.0,265.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7 M6 10v9h12v-9 M10 19v-5h4v5"/></g><text x="1023.0" y="280.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Energy dashboard</text><text x="992.0" y="304.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">lifetime energy,</text><text x="992.0" y="322.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">never decreasing</text><polyline points="212,112.0 310,112.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="261.0" y="103.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">inverter data</text><polyline points="506,98.0 660,98.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="583.0" y="89.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">0x03 0x04 0x50 0x16</text><polyline points="660,126.0 506,126.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="583.0" y="146.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">ack, ping, clock</text><polyline points="856,112.0 968,112.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="912.0" y="103.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">live 0x04 only</text><polyline points="758.0,176 758.0,244" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="1066.0,176 1066.0,244" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><line x1="24" y1="392" x2="1156" y2="392" stroke="#232a33" stroke-width="1"/><text x="24.0" y="418.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Buffered 0x50 records carry old values: they are acknowledged and counted, never shown, and the lifetime total never goes down.</text></svg>