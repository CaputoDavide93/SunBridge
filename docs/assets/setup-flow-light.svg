<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1132 612" width="1132" height="612" role="img" aria-label="The setup asks Simple or Advanced, then the port and Home Assistant's address, shows the steps for the datalogger's web page, and listens on the port until the datalogger's first record arrives; it then shows both serials and creates the entry, or after 10 minutes offers to finish anyway or listen again."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#94a3b8"/></marker></defs><rect x="24" y="56" width="196" height="112" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(40.0,69.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l1.9 5.6L18.5 10.5l-5.6 1.9L11 18l-1.9-5.6L3.5 10.5l5.6-1.9z"/></g><text x="71.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Welcome</text><text x="40.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">what SunBridge does,</text><text x="40.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Simple or Advanced</text><rect x="312" y="56" width="196" height="112" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(328.0,69.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9 M17 6h3 M4 12h3 M11 12h9 M4 18h11 M19 18h1 M15 4v4 M9 10v4 M17 16v4"/></g><text x="359.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Choose the Port</text><text x="328.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">5279, and the address</text><text x="328.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Home Assistant found</text><rect x="600" y="56" width="196" height="112" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(616.0,69.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a15 15 0 0 1 20 0 M5.5 12.5a10 10 0 0 1 13 0 M9 16a5 5 0 0 1 6 0 M12 19.5h.01"/></g><text x="647.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Point It Here</text><text x="616.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">numbered steps for the</text><text x="616.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">datalogger's web page</text><rect x="888" y="56" width="196" height="112" rx="10" fill="#14233F" stroke="#14233F" stroke-width="1"/><g transform="translate(904.0,69.0) scale(0.8750)" fill="none" stroke="#F6F1E7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 7v5l3 2"/></g><text x="935.0" y="84.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#F6F1E7" text-anchor="start" font-weight="600">Waiting</text><text x="904.0" y="108.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#F6F1E7" text-anchor="start" opacity="0.85">listens on the port,</text><text x="904.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#F6F1E7" text-anchor="start" opacity="0.85">up to 10 minutes</text><rect x="600" y="256" width="196" height="112" rx="10" fill="#fff4ed" stroke="#9a3412" stroke-width="1"/><g transform="translate(616.0,269.0) scale(0.8750)" fill="none" stroke="#9a3412" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7 M20 4v4.5h-4.5"/></g><text x="647.0" y="284.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#9a3412" text-anchor="start" font-weight="600">No Datalogger Yet</text><text x="616.0" y="308.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a3412" text-anchor="start">finish now, or</text><text x="616.0" y="326.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9a3412" text-anchor="start">listen again</text><rect x="888" y="256" width="196" height="112" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(904.0,269.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z M9 12l2 2 4-4"/></g><text x="935.0" y="284.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Datalogger Found</text><text x="904.0" y="308.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">shows the datalogger</text><text x="904.0" y="326.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">and inverter serials</text><rect x="888" y="424" width="196" height="112" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(904.0,437.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 7.5v9L12 21l9-4.5v-9z M3 7.5 12 12l9-4.5 M12 12v9"/></g><text x="935.0" y="452.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#0f172a" text-anchor="start" font-weight="600">Entry Created</text><text x="904.0" y="476.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Advanced asks for the</text><text x="904.0" y="494.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">allow-list first</text><polyline points="228,112.0 304,112.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="266.0" y="103.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">mode</text><polyline points="516,112.0 592,112.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="554.0" y="103.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">port</text><polyline points="804,112.0 880,112.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="842.0" y="103.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">Next</text><polyline points="1026.0,176 1026.0,248" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="1036.0" y="216.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="start">first record</text><polyline points="900,176 900,202 760,202 760,248" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="830.0" y="196.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">timeout</text><polyline points="780,248 780,232 920,232 920,176" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="850.0" y="248.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">try again</text><polyline points="986.0,376 986.0,416" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><polyline points="698.0,376 698.0,480.0 880,480.0" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="708.0" y="471.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="start">finish</text><line x1="24" y1="560" x2="1108" y2="560" stroke="#e6e9ee" stroke-width="1"/><text x="24.0" y="586.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">The port is open only while Waiting runs. It closes before the entry starts its own listener, and when setup is abandoned.</text></svg>