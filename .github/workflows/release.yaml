name: Release

# Pushing a tag vX.Y.Z publishes the GitHub release HACS installs. It refuses
# unless the tag, manifest.json's version and CHANGELOG.md's newest section
# agree (tools/release_notes.py), and the checks pass on the tagged commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Tag, manifest and CHANGELOG agree
        run: python tools/release_notes.py "$GITHUB_REF_NAME" > release-notes.md

      - name: Install dependencies
        run: python -m pip install -r requirements_test.txt

      - name: The checks pass on the tagged commit
        run: |
          ruff check .
          mypy
          python tools/gen_diagram.py --check
          python tools/gen_docs.py --check
          pytest -q --cov --cov-report=term

      - name: Archive for a manual install
        # The same folder HACS copies: unzip into config/custom_components/.
        run: |
          cd custom_components
          zip -r -X "$GITHUB_WORKSPACE/sunbridge.zip" sunbridge -x '*/__pycache__/*'

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" sunbridge.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
