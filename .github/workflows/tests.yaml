name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly: Home Assistant moves under us
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, tests and diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Home Assistant 2026.3 and later need Python 3.14.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: python -m pip install -r requirements_test.txt

      - name: ruff
        run: ruff check .

      - name: Diagrams and README tables are current
        run: |
          python tools/gen_diagram.py --check
          python tools/gen_docs.py --check

      - name: pytest
        run: pytest -q
